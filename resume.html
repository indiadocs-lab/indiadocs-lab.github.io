<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>

<style>
body{
font-family: Arial;
margin:0;
background:#f2f2f2;
}

.container{
display:flex;
flex-wrap:wrap;
max-width:1100px;
margin:20px auto;
gap:20px;
}

.form-section, .preview-section{
flex:1 1 450px;
background:white;
padding:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

input, textarea{
width:100%;
padding:8px;
margin-bottom:10px;
}

button{
padding:10px;
background:black;
color:white;
border:none;
cursor:pointer;
width:100%;
}

.resume{
display:flex;
}

.left{
width:35%;
background:#111827;
color:white;
padding:20px;
}

.right{
width:65%;
padding:20px;
}

img{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;
}

@media(max-width:768px){
.resume{
flex-direction:column;
}
.left,.right{
width:100%;
}
}
</style>
</head>

<body>

<div class="container">

<div class="form-section">
<h2>Create Resume</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="email" placeholder="Email">
<input type="text" id="phone" placeholder="Phone">
<input type="text" id="location" placeholder="Location">

<textarea id="objective" placeholder="Career Objective"></textarea>
<input type="text" id="skills" placeholder="Skills (comma separated)">
<input type="text" id="languages" placeholder="Languages (comma separated)">
<input type="file" id="photo">

<button onclick="generateResume()">Generate Resume</button>
<button onclick="window.print()">Download PDF</button>

</div>

<div class="preview-section">
<div id="resumeOutput"></div>
</div>

</div>

<script>
function generateResume(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let phone=document.getElementById("phone").value;
let location=document.getElementById("location").value;
let objective=document.getElementById("objective").value;
let skills=document.getElementById("skills").value.split(",");
let languages=document.getElementById("languages").value.split(",");
let photo=document.getElementById("photo").files[0];

let photoHTML="";
if(photo){
let url=URL.createObjectURL(photo);
photoHTML="<img src='"+url+"'>";
}

let skillList="";
skills.forEach(s=>{
if(s.trim()!=""){
skillList+="<li>"+s+"</li>";
}
});

let langList="";
languages.forEach(l=>{
if(l.trim()!=""){
langList+="<li>"+l+"</li>";
}
});

document.getElementById("resumeOutput").innerHTML=
`
<div class="resume">
<div class="left">
${photoHTML}
<h2>${name}</h2>
<p>${email}</p>
<p>${phone}</p>
<p>${location}</p>
<h3>Skills</h3>
<ul>${skillList}</ul>
<h3>Languages</h3>
<ul>${langList}</ul>
</div>

<div class="right">
<h3>Career Objective</h3>
<p>${objective}</p>
</div>
</div>
`;

}
</script>

</body>
</html>
